name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure lint
        run: ./scripts/lint.sh

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Run tests
        run: swift test

  build:
    runs-on: macos-14
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build release
        run: swift build -c release
      - name: Package .app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="NoriNotes.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp $(swift build -c release --show-bin-path)/NoriNotes "$APP/Contents/MacOS/NoriNotes"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Nori Notes</string>
            <key>CFBundleDisplayName</key><string>Nori Notes</string>
            <key>CFBundleExecutable</key><string>NoriNotes</string>
            <key>CFBundleIdentifier</key><string>com.example.NoriNotes</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "NoriNotes-${VERSION}-macos.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoriNotes-macos
          path: NoriNotes-*-macos.zip
