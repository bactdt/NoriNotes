name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build (debug check)
        run: swift build -v

      - name: Build release binary
        run: |
          swift build -c release
          BIN=$(swift build -c release --show-bin-path)/NoriNotes

      - name: Package .app bundle
        run: |
          APP="NoriNotes.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp $(swift build -c release --show-bin-path)/NoriNotes "$APP/Contents/MacOS/NoriNotes"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Nori Notes</string>
            <key>CFBundleDisplayName</key><string>Nori Notes</string>
            <key>CFBundleExecutable</key><string>NoriNotes</string>
            <key>CFBundleIdentifier</key><string>com.example.NoriNotes</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.productivity</string>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" NoriNotes-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoriNotes-macos
          path: NoriNotes-macos.zip
